<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Form Filler mark: an "F" built from two form fields, with a spark for "filled for you" -->
  <defs>
    <linearGradient id="ff-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="ff-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#ff-bg)"/>
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#ff-sheen)"/>
  <!-- stem -->
  <rect x="24" y="22" width="12" height="52" rx="6" fill="#ffffff"/>
  <!-- field 1 (filled) -->
  <rect x="24" y="22" width="48" height="16" rx="8" fill="#ffffff"/>
  <!-- field 2 with a caret -->
  <rect x="24" y="44" width="34" height="14" rx="7" fill="#ffffff" fill-opacity=".92"/>
  <rect x="49" y="47.5" width="3" height="7" rx="1.5" fill="#4F46E5"/>
  <!-- spark -->
  <path d="M68 56 C69.2 62.6 70.4 63.8 77 65 C70.4 66.2 69.2 67.4 68 74 C66.8 67.4 65.6 66.2 59 65 C65.6 63.8 66.8 62.6 68 56 Z" fill="#C7D2FE"/>
</svg>
