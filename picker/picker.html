<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pick from locker</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="../lib/imgedit.css">
  <style>
    body { padding: 16px 20px 20px; min-height: 100vh; }
    header { display: flex; align-items: center; gap: 10px; margin: -16px -20px 16px; padding: 12px 16px 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { flex: 1; font-size: 15px; line-height: 22px; margin: 0; font-weight: 650; }
    #field { margin-bottom: 4px; }
    .req { margin-bottom: 12px; }
    .req:empty { display: none; }
    .req b { color: var(--text); }
    .list { display: grid; gap: 8px; }
    .item { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow-xs); transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
    .item:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
    .item b { font-size: 13.5px; }
    .item .row button { --bh: 32px; }
    .item.dim { opacity: .55; }
    .item .th { width: 64px; height: 64px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; font-weight: 700; color: var(--accent); font-size: 12px; }
    .item .th img { max-width: 100%; max-height: 100%; }
    .warn { color: var(--warn-ink); }
    .resize { margin-top: 12px; }
    .resize .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
    #preview { max-width: 100%; max-height: 180px; border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; background: #fff; }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon48.png" width="24" height="24" alt="">
    <h1>Pick from locker</h1>
    <button id="close" class="ghost sm">Close</button>
  </header>
  <div id="lock" class="hidden"></div>
  <div id="main" class="hidden">
    <div class="small muted" id="field"></div>
    <div id="req" class="req small"></div>
    <div id="browse">
      <div class="row" style="margin-bottom:10px">
        <input id="search" placeholder="Search name or tag" class="grow">
        <label class="btn small">From this computer…<input type="file" id="from-file" accept="image/*" hidden></label>
      </div>
      <div id="list" class="list"></div>
    </div>
    <div id="resize" class="hidden"></div>
    <div id="msg" class="small" style="margin-top:8px"></div>
  </div>
  <script type="module" src="picker.js"></script>
</body>
</html>
