<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form Filler</title>
  <script src="../lib/theme.js"></script>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="pop-head strip">
    <span class="wordmark"><img src="../icons/icon48.png" width="26" height="26" alt=""><span class="name">Form <span>Filler</span></span></span>
    <button id="lock-now" class="icon-btn hidden" title="Lock now" aria-label="Lock now">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    </button>
  </header>

  <div id="lock" class="pop-body hidden"></div>

  <div id="main" class="pop-body hidden">
    <label class="profile-pick"><span>Fill as</span><select id="profile" aria-label="Profile to fill with"></select></label>

    <label class="switch-row replace">
      <span class="switch-text">Replace values already in the form</span>
      <input type="checkbox" class="switch" id="overwrite">
    </label>

    <button class="btn-sunset lg" id="fill">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c.7 4.3 1.9 5.6 6 6.3-4.1.7-5.3 2-6 6.2-.7-4.2-1.9-5.5-6-6.2 4.1-.7 5.3-2 6-6.3z"/></svg>
      <span class="label">Fill this form</span>
    </button>

    <div id="ai-note" class="ai-note hidden"><span class="pulse" aria-hidden="true"></span><span id="ai-note-text"></span>
      <button class="link" id="go-settings">Settings</button></div>

    <div id="result" aria-live="polite"></div>
  </div>

  <nav class="pop-links hidden" id="links" aria-label="Open">
    <button class="ghost sm" id="open-profile">My Profile</button>
    <button class="ghost sm" id="open-docs">Locker</button>
    <button class="ghost sm" id="open-pdf">Fill a PDF</button>
    <button class="ghost sm" id="open-settings">Settings</button>
    <a class="btn ghost sm" href="../privacy.html" target="_blank">Privacy</a>
  </nav>
  <script type="module" src="popup.js"></script>
</body>
</html>
